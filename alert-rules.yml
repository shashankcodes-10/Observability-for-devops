groups:
  - name: server-alerts
    rules:
      - alert: HighCPUUsage
        expr: |
          100 * (1 - avg by(instance) (
            rate(node_cpu_seconds_total{mode="idle"}[5m])
          )) > 80
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High CPU Usage"
          description: "EC2 CPU usage is above 80%."

      - alert: InstanceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Instance Down"
          description: "A monitoring target is down."
      
      - alert: TestAlert
        expr: vector(1)
        for: 15s
        labels:
          severity: warning
        annotations:
          summary: "Testing Alertmanager"
          description: "This is a test notification."     
